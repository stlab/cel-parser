# SPDX-License-Identifier: BSL-1.0
# The cpp-library hosted matrix is gated. This manual entry accepts provisioned
# public packages; it deliberately defines no hosting or source acquisition policy.
name: Provisioned local inputs
on:
  workflow_dispatch:
    inputs:
      runtime_prefix:
        description: Installed Release cel-runtime prefix on the provisioned runner
        required: true
        type: string
      sanitized_runtime_prefix:
        description: Matching ASan+UBSan cel-runtime prefix
        required: true
        type: string
      reference_source:
        description: Local cel-rs source checkout including Cargo.lock
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: provisioned-validation
  cancel-in-progress: false
jobs:
  validate:
    # No runner or remote hosting is provisioned by this repository.
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Require provisioned inputs
        shell: bash
        env:
          RUNTIME_PREFIX: ${{ inputs.runtime_prefix }}
          SANITIZED_RUNTIME_PREFIX: ${{ inputs.sanitized_runtime_prefix }}
          REFERENCE_SOURCE: ${{ inputs.reference_source }}
        run: |
          test -f "$RUNTIME_PREFIX/lib/cmake/cel-runtime/cel-runtimeConfig.cmake"
          test -f "$SANITIZED_RUNTIME_PREFIX/lib/cmake/cel-runtime/cel-runtimeConfig.cmake"
          test -f "$REFERENCE_SOURCE/cel-parser/Cargo.toml"
          test -f "$REFERENCE_SOURCE/Cargo.lock"
      - name: Debug and Release unit, negative compilation, parity, and installed clients
        shell: bash
        env:
          RUNTIME_PREFIX: ${{ inputs.runtime_prefix }}
          REFERENCE_SOURCE: ${{ inputs.reference_source }}
        run: |
          for mode in Debug Release; do
            cmake -S . -B "build/provisioned-$mode" -G Ninja \
              "-DCMAKE_BUILD_TYPE=$mode" -DBUILD_TESTING=ON \
              "-DCMAKE_CXX_FLAGS=-Wall -Wextra -Wpedantic -Werror" \
              "-Dcel-runtime_DIR=$RUNTIME_PREFIX/lib/cmake/cel-runtime" \
              -DCEL_PARSER_ENABLE_PARITY=ON \
              "-DCEL_PARSER_REFERENCE_SOURCE=$REFERENCE_SOURCE" \
              -DCEL_PARSER_BUILD_MEASUREMENTS=ON
            cmake --build "build/provisioned-$mode"
            ctest --test-dir "build/provisioned-$mode" --output-on-failure
            if [ "$mode" = Release ]; then
              build/provisioned-Release/measurement 100000
            fi
          done
      - name: Matching instrumented packages
        shell: bash
        env:
          SANITIZED_RUNTIME_PREFIX: ${{ inputs.sanitized_runtime_prefix }}
          REFERENCE_SOURCE: ${{ inputs.reference_source }}
        run: |
          cmake -S . -B build/provisioned-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            "-Dcel-runtime_DIR=$SANITIZED_RUNTIME_PREFIX/lib/cmake/cel-runtime" \
            -DCEL_PARSER_ENABLE_PARITY=ON \
            "-DCEL_PARSER_REFERENCE_SOURCE=$REFERENCE_SOURCE" \
            "-DCMAKE_CXX_FLAGS=-Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" \
            -DCEL_PARSER_BUILD_MEASUREMENTS=ON
          cmake --build build/provisioned-sanitized
          if [ "$(uname)" = Darwin ]; then
            export ASAN_OPTIONS=detect_leaks=0
          fi
          UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build/provisioned-sanitized --output-on-failure
      - name: Lint and strict documentation
        shell: bash
        env:
          RUNTIME_PREFIX: ${{ inputs.runtime_prefix }}
          REFERENCE_SOURCE: ${{ inputs.reference_source }}
        run: |
          git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror
          cmake --preset clang-tidy \
            "-Dcel-runtime_DIR=$RUNTIME_PREFIX/lib/cmake/cel-runtime" \
            "-DCMAKE_CXX_FLAGS=-Wall -Wextra -Wpedantic -Werror" \
            -DCEL_PARSER_ENABLE_PARITY=ON \
            "-DCEL_PARSER_REFERENCE_SOURCE=$REFERENCE_SOURCE" \
            -DCEL_PARSER_BUILD_MEASUREMENTS=ON
          cmake --build --preset clang-tidy
          ctest --preset clang-tidy
          cargo fmt --manifest-path build/provisioned-Debug/parity-reference/Cargo.toml --check
          cargo test --manifest-path build/provisioned-Debug/parity-reference/Cargo.toml --locked
          cargo clippy --manifest-path build/provisioned-Debug/parity-reference/Cargo.toml \
            --locked --all-targets -- -D warnings
          cmake --preset docs "-Dcel-runtime_DIR=$RUNTIME_PREFIX/lib/cmake/cel-runtime"
          cmake --build --preset docs
